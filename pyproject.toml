[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nearby-python"
description = "Variability Analysis for EEG/BCI"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dynamic = ["version"]

authors = [
    { name = "Simon Kojima, Alex Pepi, Fabien Lotte" },
]

dependencies = [
    "numpy",
    "mne>=1.8",
    "pandas",
    "autograd",
    "pymanopt",
    "tslearn>=0.9.0",
    "pyriemann",
]

[dependency-groups]
dev = [
    "moabb>=1.7.2",
    "black",
    "pytest",
    "sphinx",
    "pydata-sphinx-theme",
    "sphinx-multiversion",
    "sphinx-gallery",
    "numpydoc",
]

[tool.setuptools.dynamic]
version = { attr = "nearby.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["nearby*"]
